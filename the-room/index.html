<title>the room | without armour</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Manrope:wght@400;500;600&display=swap');
:root{color-scheme:dark;--bg:#0a0909;--panel:#12100f;--line:#302723;--text:#e7ded6;--muted:#9d8e84;--rust:#b88970}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#211814 0%,var(--bg) 55%);color:var(--text);font-family:Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,720px)}.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--rust)}h1{font:clamp(42px,8vw,68px)/.98 'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:-.035em;margin:18px 0 14px}p{line-height:1.8;color:var(--muted)}.panel{border:1px solid var(--line);background:#0e0c0bd9;padding:clamp(24px,6vw,44px);box-shadow:0 25px 100px #0008}.small{font:11px 'DM Mono',monospace;letter-spacing:.08em;color:#8e7d72}.field{display:flex;gap:10px;margin-top:25px}input,button{font:inherit;border-radius:2px}input{min-width:0;flex:1;background:#090808;border:1px solid #41332c;color:var(--text);padding:14px 13px;outline:none}input:focus{border-color:var(--rust)}button{background:var(--rust);color:#160e0b;border:0;padding:0 18px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}#error{min-height:22px;color:#d89a86;font-size:13px}.letter{display:none;margin-top:32px;border-top:1px solid var(--line);padding-top:26px}.letter p{white-space:pre-wrap;color:#d7cbc1;font-size:15px;line-height:1.95;margin:0 0 1.3em}.letter .salutation{font:30px 'DM Serif Display',Georgia,serif;color:var(--text)}.footer{margin-top:30px;font:10px 'DM Mono',monospace;letter-spacing:.12em;color:#675950;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.lockagain{display:none;margin-top:8px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 12px;font-size:12px}@media(max-width:480px){body{padding:14px}.field{flex-direction:column}button{padding:13px}.panel{padding:22px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">private note / 01</div>
  <h1>the room<br><span style="color:var(--rust)">without armour</span></h1>
  <p>Some things are easier to write when the world is quiet. This is one of them.</p>
  <section class="panel">
    <div id="gate">
      <div class="small">ACCESS IS PRIVATE</div>
      <p>For the person this was written for. Take your time.</p>
      <form id="unlock">
        <div class="field"><input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required><button type="submit">Open the room</button></div>
      </form>
      <div id="error" role="status"></div>
    </div>
    <article class="letter" id="letter" aria-live="polite"></article>
    <button class="lockagain" id="lockagain" type="button">Close the room</button>
  </section>
  <div class="footer"><span>not made for everyone</span><span>read gently</span></div>
</main>

const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openLetter(pass){
 const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:from64(payload.salt),iterations:310000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:from64(payload.iv),additionalData:new TextEncoder().encode("the-room-v1")},key,from64(payload.cipher));
 const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate"));
 return await new Response(stream).text();
}
const form=document.getElementById("unlock"), gate=document.getElementById("gate"), out=document.getElementById("letter"), err=document.getElementById("error"), lock=document.getElementById("lockagain");
form.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";const button=form.querySelector("button");button.disabled=true;button.textContent="Opening…";try{const text=await openLetter(document.getElementById("pass").value);out.replaceChildren();text.split("\n\n").forEach((para,i)=>{const p=document.createElement("p");p.textContent=para;if(i===0)p.className="salutation";out.appendChild(p)});gate.style.display="none";out.style.display="block";lock.style.display="inline-block";}catch(e){err.textContent="That passphrase did not open the room. Try again.";document.getElementById("pass").select();}finally{button.disabled=false;button.textContent="Open the room";}});
lock.addEventListener("click",()=>{out.replaceChildren();out.style.display="none";gate.style.display="block";lock.style.display="none";document.getElementById("pass").value="";err.textContent="";});
